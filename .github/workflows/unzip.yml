
name: Auto Unzip Source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - source.zip

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Verify that the ZIP file exists
      - name: Check ZIP file
        run: |
          if [ ! -f source.zip ]; then
            echo "Error: source.zip not found!"
            exit 1
          fi

          echo "ZIP file found."
          ls -lh source.zip

      # Extract source files without overwriting GitHub workflows
      - name: Extract ZIP
        run: |
          unzip -o source.zip -d . \
            -x '.github/workflows/*'

          echo "Extraction completed."

      # Remove the original ZIP file
      - name: Remove ZIP
        run: |
          rm -f source.zip
          echo "Original ZIP file removed."

      # Commit and push extracted source files
      # Exclude workflow files to avoid permission errors
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':(exclude).github/workflows/**'

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract uploaded source code"
            git push origin HEAD:main
          fi
