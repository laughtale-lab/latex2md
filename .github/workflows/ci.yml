name: Test latex2md and review Manual compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests and source distribution
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - name: Install converter
        run: python -m pip install -e .
      - name: Run all self-contained tests
        run: python -m unittest discover -s tests -v
      - name: Assert source code compiles
        run: python -m compileall -q src
      - name: Build distributable wheel and sdist
        if: matrix.python == '3.12'
        run: python -m build
      - name: Upload Python packages (not a formal GitHub Release)
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  manual-smoke:
    name: Full Diabat Manual compatibility and mdBook smoke test
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - name: Checkout independent converter
        uses: actions/checkout@v4
        with:
          path: converter
          persist-credentials: false
      # Compatibility checks intentionally use the public manual's current
      # main for continuous feedback. Production manual builds MUST pin
      # this converter to a reviewed tag SHA, never to converter main.
      - name: Checkout current public Diabat Manual
        uses: actions/checkout@v4
        with:
          repository: laughtale-lab/diabat-manual
          ref: main
          path: manual
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter
        run: python -m pip install ./converter
      - name: Convert and validate all source references/assets
        run: python -m latex2md build --source manual --output "$RUNNER_TEMP/generated-book"
      - name: Check key reference and export files
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/generated-book/src/SUMMARY.md"
          test -s "$RUNNER_TEMP/generated-book/src/references.md"
          test -f "$RUNNER_TEMP/generated-book/src/assets/diabat-logo.png"
          python - "$RUNNER_TEMP/generated-book/conversion-report.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          stats=data['statistics']
          for key in ['keywords','overview_items','listings','resolved_links','chapters']:
              assert stats[key] > 0, (key, stats)
          assert all(label['page'] for label in data['labels'].values())
          print('Manual content and anchors verified:',stats)
          PY
      # Pin 0.4.52 for the preview tests. Deliberate mdBook upgrades must
      # be previewed before production changes to the Manual repository.
      - name: Install fixed mdBook 0.4.52
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52
          fallback: none
      - name: Render generated HTML (CI verification only; do not deploy)
        run: mdbook build "$RUNNER_TEMP/generated-book"
      - name: Check rendered site structure
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/generated-book/book/index.html"
          test -s "$RUNNER_TEMP/generated-book/book/diabatization.html"
          test -s "$RUNNER_TEMP/generated-book/book/references.html"
          test -s "$RUNNER_TEMP/generated-book/book/searchindex.js"
      - name: Upload conversion diagnostics for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-manual-conversion-report
          path: |
            ${{ runner.temp }}/generated-book/conversion-report.json
            ${{ runner.temp }}/generated-book/src/SUMMARY.md
          if-no-files-found: warn
