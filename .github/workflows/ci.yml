name: Test latex2md and review Manual compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests and source distribution
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - name: Install converter
        run: python -m pip install -e .
      - name: Assert all Python code compiles before importing tests
        run: python -m compileall -q src tests
      - name: Run all self-contained tests
        run: python -m unittest discover -s tests -v
      - name: Build distributable wheel and sdist
        if: matrix.python == '3.12'
        run: python -m build
      - name: Upload Python packages (not a formal GitHub Release)
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  mdbook-fixture:
    name: Real mdBook 0.4.52 target/link contract
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter
        run: python -m pip install .
      - name: Install fixed mdBook 0.4.52
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52
          fallback: none
      - name: Confirm exact mdBook version
        shell: bash
        run: test "$(mdbook --version)" = "mdbook v0.4.52"
      - name: Convert minimal LaTeX cross-reference fixture
        run: python -m latex2md build --source tests/fixtures/mdbook-manual --output "$RUNNER_TEMP/fixture-book"
      - name: Render fixture with the real pinned mdBook
        run: mdbook build "$RUNNER_TEMP/fixture-book"
      - name: Audit every fixture target and rendered local link
        run: >-
          latex2md-audit-html
          --report "$RUNNER_TEMP/fixture-book/conversion-report.json"
          --html "$RUNNER_TEMP/fixture-book/book"
          --allow-missing diabat.pdf
      - name: Upload real rendered fixture for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mdbook-0.4.52-cross-reference-fixture
          path: ${{ runner.temp }}/fixture-book/book/
          if-no-files-found: error

  manual-smoke:
    name: Full Diabat Manual + real mdBook HTML audit
    runs-on: ubuntu-24.04
    needs: [tests, mdbook-fixture]
    steps:
      - name: Checkout independent converter
        uses: actions/checkout@v4
        with:
          path: converter
          persist-credentials: false
      # Compatibility checks intentionally use the public manual's current
      # main for continuous feedback. Production manual builds MUST pin
      # this converter to a reviewed tag SHA, never to converter main.
      - name: Checkout current public Diabat Manual
        uses: actions/checkout@v4
        with:
          repository: laughtale-lab/diabat-manual
          ref: main
          path: manual
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter
        run: python -m pip install ./converter
      - name: Convert the complete current Manual
        run: python -m latex2md build --source manual --output "$RUNNER_TEMP/generated-book"
      - name: Check reviewed Manual content baseline and generated source targets
        shell: bash
        run: |
          set -euo pipefail
          python -m latex2md.verify \
            --report "$RUNNER_TEMP/generated-book/conversion-report.json" \
            --baseline converter/docs/diabat-2.0-baseline.json
          test -s "$RUNNER_TEMP/generated-book/src/SUMMARY.md"
          test -s "$RUNNER_TEMP/generated-book/src/references.md"
          test -f "$RUNNER_TEMP/generated-book/src/assets/diabat-logo.png"
          python - "$RUNNER_TEMP/generated-book/conversion-report.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          stats=data['statistics']
          for key in ['keywords','overview_items','listings','resolved_links','chapters']:
              assert stats[key] > 0, (key, stats)
          targets=data['targets']
          assert len(targets) >= len(data['labels'])
          assert all(t['page'] and t['render'] in {'heading','raw-html'} for t in targets.values())
          print('Manual source targets verified:', len(targets), stats)
          PY
      - name: Install fixed mdBook 0.4.52
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52
          fallback: none
      - name: Confirm exact mdBook version
        shell: bash
        run: test "$(mdbook --version)" = "mdbook v0.4.52"
      - name: Render generated HTML with the real pinned mdBook
        run: mdbook build "$RUNNER_TEMP/generated-book"
      - name: Audit every registered target, fragment, page, and local resource
        run: >-
          latex2md-audit-html
          --report "$RUNNER_TEMP/generated-book/conversion-report.json"
          --html "$RUNNER_TEMP/generated-book/book"
          --allow-missing diabat.pdf
      - name: Check search and key site products
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/generated-book/book/index.html"
          test -s "$RUNNER_TEMP/generated-book/book/diabatization.html"
          test -s "$RUNNER_TEMP/generated-book/book/references.html"
          test -s "$RUNNER_TEMP/generated-book/book/searchindex.js"
      - name: Upload complete rendered Manual preview and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-manual-mdbook-0.4.52-preview
          path: |
            ${{ runner.temp }}/generated-book/book/
            ${{ runner.temp }}/generated-book/conversion-report.json
            ${{ runner.temp }}/generated-book/src/SUMMARY.md
          if-no-files-found: warn
